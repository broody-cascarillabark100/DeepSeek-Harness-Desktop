<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
<title>正在启动 DeepSeek Harness…</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0f1117;
    color: #e6e6e6;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4d6bfe, #6e4dfe);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  p  { font-size: 12.5px; color: #9aa3b2; margin: 0 0 20px; }
  .bar {
    width: 220px; height: 4px; margin: 0 auto;
    background: #232936; border-radius: 2px; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, #4d6bfe, #6e4dfe);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">DSH</div>
    <h1>正在启动 DeepSeek Harness…</h1>
    <p>首次启动需要构建并拉起服务，请稍候</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
